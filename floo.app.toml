[app]
name = "cursus"
# Floo's gateway no longer locks the app: Cursus handles sign-in itself with
# Floo User accounts (see [managed.default.users] and src/proxy.ts). Keep this
# explicit, because leaving it out keeps the environment's current mode.
access_mode = "public"

[services.web]
type = "web"
path = "."
port = 3000
ingress = "public"
dev_command = "npm run dev"
migrate_command = "node db/migrate.mjs"

[services.web.env]
required = ["NEON_AUTH_COOKIE_SECRET"]
optional = ["DUKE_API_TOKEN", "ADMIN_EMAILS"]

[managed.default]
type = "postgres"

[managed.default.users]
methods = ["email_password", "google"]
signup = "open"
