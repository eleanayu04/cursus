[app]
name = "cursus"
# Floo's gateway handles sign-in and passes X-Floo-User-* headers.
# Accounts mode is invite-only: add people with `floo apps invite`.
access_mode = "accounts"

[auth]
access_policy = "invite"

[auth.branding]
display_name = "Cursus"
accent_color = "#1d3f8f"

[services.web]
type = "web"
path = "."
port = 3000
ingress = "public"
dev_command = "npm run dev"
migrate_command = "node db/migrate.mjs"

[services.web.env]
optional = ["DUKE_API_TOKEN"]

[managed.default]
type = "postgres"
