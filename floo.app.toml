[app]
name = "cursus"
# Floo's gateway no longer locks the app: Cursus handles sign-in itself with
# Floo User accounts (see [managed.default.users] and src/proxy.ts). Keep this
# explicit, because leaving it out keeps the environment's current mode.
access_mode = "public"

[services.web]
type = "web"
path = "."
port = 3000
ingress = "public"
dev_command = "npm run dev"
migrate_command = "node db/migrate.mjs"

[services.web.env]
optional = ["DUKE_API_TOKEN", "ADMIN_EMAILS"]

[managed.default]
type = "postgres"

# Floo serves sign-in at /api/auth on our domain; users live in floo_auth.
[managed.default.users]
# Email and password only: Duke email is Microsoft 365, so Google sign-in was
# dropped. Google-only accounts set a password once with "Forgot password".
methods = ["email_password"]
signup = "open"
# New sign-ups need a Duke address. Existing accounts (like ADMIN_EMAILS) keep working.
allowed_email_domains = ["duke.edu"]
